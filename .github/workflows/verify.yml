name: verify

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get install --yes --no-install-recommends pipx ripgrep
          pipx install "reuse[charset-normalizer]==6.2.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
      - name: Verify repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./utl/gh/repo-metadata.sh --check
      - name: Verify
        run: make verify
