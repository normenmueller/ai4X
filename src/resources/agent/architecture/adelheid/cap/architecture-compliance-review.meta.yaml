id: architecture-compliance-review
version: 0.2.1
owner: nemron
requires: []
conflicts: []
do_not_use_when: ["when the task is to create architecture direction rather than evaluate conformance against approved principles, standards, or decisions","when no architecture baseline exists to review against"]
distinguish_from:
  - id: architecture-practice-leadership
    boundary: "Use practice leadership to establish a review mandate. Compliance review applies an existing standard to a proposed design."
  - id: enterprise-architecture-integration
    boundary: "Use enterprise integration to reconcile cross-segment policies. Compliance review evaluates a proposal against the policies already approved."
  - id: solution-realization-architecture
    boundary: "Use solution realization to design the remedy. Compliance review records the deviation, impact and action required."
sources:
  - title: "The TOGAF Standard, 10th Edition"
    organization: "The Open Group"
    url: "https://publications.opengroup.org/c220"
    kind: "standard"
    accessed_at: "2026-03-20"
