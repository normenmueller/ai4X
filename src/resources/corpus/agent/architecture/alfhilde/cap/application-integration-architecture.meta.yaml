id: application-integration-architecture
version: 0.1.2
owner: nemron
requires: ["architecture-decision-rigor"]
conflicts: []
do_not_use_when: ["when the problem is primarily data governance or technology platform architecture","when one concrete solution change needs realization governance more than domain architecture"]
distinguish_from:
  - id: data-governance-architecture
    boundary: "Use data governance for record ownership, retention and migration across those interfaces."
  - id: technology-platform-architecture
    boundary: "Use platform architecture when the choice is the shared runtime or network standard on which the applications depend."
  - id: solution-realization-architecture
    boundary: "Use solution realization to stage and govern one delivery across components after the application responsibilities are known."
sources:
