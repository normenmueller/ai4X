id: business-service-architecture
version: 0.1.2
owner: nemron
requires: []
conflicts: []
do_not_use_when: ["when data, application, or technology-domain concerns dominate the architecture problem","when the task is generic strategic planning without a business-architecture boundary"]
distinguish_from:
  - id: capability-map-governance
    boundary: "Use map governance to define capability granularity or prioritize gaps across the map. Service architecture relates a service to its delivery and outcomes."
  - id: data-governance-architecture
    boundary: "Use data governance to assign stewardship or protection of the records a business service uses."
  - id: application-integration-architecture
    boundary: "Use application integration to determine which systems expose or consume the interfaces that support a business service."
  - id: technology-platform-architecture
    boundary: "Use platform architecture for the shared infrastructure or service levels on which delivery depends."
sources:
  - title: "Architecture Roles and Skills - Segment Architect (Business and Technical)"
    organization: "The Open Group"
    url: "https://pubs.opengroup.org/togaf-standard/architecture-roles-and-skills/chap04.html#_segment_architect_business_and_technical"
    kind: "standard"
    accessed_at: "2026-03-24"
