id: archimate-viewpoint-selection
version: 0.2.0
owner: nemron
requires: ["togaf-adm-discipline"]
conflicts: []
do_not_use_when: ["when the relevant problem is cross-layer inconsistency rather than viewpoint fit for a stakeholder question"]
