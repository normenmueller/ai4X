id: solution-realization-architecture
version: 0.1.1
owner: nemron
requires: ["baseline-target-gap-analysis","transition-architecture-planning","architecture-decision-rigor"]
conflicts: []
do_not_use_when: ["when the task is enterprise or segment governance without a concrete solution scope","when the task is generic project planning or handover without architecture realization content"]
distinguish_from:
  - id: segment-architecture-stewardship
    boundary: "Use segment stewardship for the policies and roadmap shared across an entire segment."
  - id: transition-architecture-planning
    boundary: "Use transition planning for the entry and exit conditions between states. Solution realization also defines components, interfaces and implementation governance."
  - id: agentic-solution-architecture
    boundary: "Use agentic solution architecture to locate reasoning, state, tools and escalation inside an agent runtime."
sources:
  - title: "Architecture Roles and Skills - Solution Architect"
    organization: "The Open Group"
    url: "https://pubs.opengroup.org/togaf-standard/architecture-roles-and-skills/chap04.html#_solution_architect"
    kind: "standard"
    accessed_at: "2026-03-24"
  - title: "Architecture Roles and Skills - Skill/Architecture Role Matrix"
    organization: "The Open Group"
    url: "https://pubs.opengroup.org/togaf-standard/architecture-roles-and-skills/chap05.html#tbl-Skill-Architecture-Role_Matrix"
    kind: "standard"
    accessed_at: "2026-03-24"
