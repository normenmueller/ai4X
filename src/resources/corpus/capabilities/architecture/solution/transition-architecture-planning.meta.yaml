id: transition-architecture-planning
version: 0.2.1
owner: nemron
requires: []
conflicts: []
do_not_use_when: ["when baseline and target have not been compared yet","when the task is a single target-state compliance check rather than staged change design"]
distinguish_from:
  - id: baseline-target-gap-analysis
    boundary: "Use gap analysis to establish what differs and why it matters. Transition planning defines how and when the next state can be entered."
  - id: solution-realization-architecture
    boundary: "Use solution realization to define component topology and implementation governance for a concrete change. Transition planning focuses on the intermediate states."
sources:
  - title: "The TOGAF Standard, 10th Edition"
    organization: "The Open Group"
    url: "https://publications.opengroup.org/c220"
    kind: "standard"
    accessed_at: "2026-03-20"
