version = 1

[[annotations]]
path = [
  ".ai4x/*.md",
  ".ai4x/*.yaml",
  ".ai4x/agents/**",
  ".ai4x/assurance/**",
  ".ai4x/bindings/**",
  ".ai4x/context/**",
  ".ai4x/coordination/**",
  ".ai4x/governance/**",
  ".ai4x/intent/**",
  ".ai4x/operations/**",
  ".ai4x/records/**",
  ".github/ISSUE_TEMPLATE/**",
  ".github/agents/**",
  ".github/copilot-instructions.md",
  "AGENTS.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "GOVERNANCE.md",
  "LICENSING.md",
  "README.md",
  "SECURITY.md",
  "doc/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 nemron <https://github.com/normenmueller>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  ".ai4x/.gitignore",
  ".ai4x/generated/**",
  ".codex/**",
  ".github/workflows/**",
  ".github/CODEOWNERS",
  ".gitignore",
  "Makefile",
  "REUSE.toml",
  "src/**",
  "util/**",
]
