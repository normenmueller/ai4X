version = 1

[[annotations]]
path = [
  ".ai4x/*.md",
  ".ai4x/*.yaml",
  ".ai4x/agent/**",
  ".ai4x/assurance/**",
  ".ai4x/binding/**",
  ".ai4x/context/**",
  ".ai4x/coordination/**",
  ".ai4x/governance/**",
  ".ai4x/intent/**",
  ".ai4x/operation/**",
  ".ai4x/record/**",
  ".github/ISSUE_TEMPLATE/**",
  ".github/agents/**",
  ".github/copilot-instructions.md",
  "AGENTS.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "GOVERNANCE.md",
  "LICENSING.md",
  "README.md",
  "SECURITY.md",
  "doc/**",
  "acc/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 nemron <https://github.com/normenmueller>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  ".ai4x/.gitignore",
  ".ai4x/generated/**",
  ".codex/**",
  ".github/workflows/**",
  ".github/CODEOWNERS",
  ".gitignore",
  "Makefile",
  "REUSE.toml",
  "src/**",
  "util/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 nemron <https://github.com/normenmueller>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["src/resources/agent/**", "src/resources/corpus/capability/**", "src/resources/corpus/governance/**/*.md", "src/resources/corpus/governance/*.md", "src/resources/corpus/governance/index.yaml"]
precedence = "override"
SPDX-FileCopyrightText = "2026 nemron <https://github.com/normenmueller>"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["util/work-continuity/README.md", "util/work-continuity/RECOVERY.md", "util/work-continuity/INCLUDE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 nemron <https://github.com/normenmueller>"
SPDX-License-Identifier = "CC-BY-4.0"
