version = 1

[[annotations]]
path = [
  ".ai4x/*.dhall",
  ".ai4x/*.md",
  ".ai4x/*.yaml",
  ".ai4x/agents/**",
  ".ai4x/assurance/**",
  ".ai4x/bindings/**",
  ".ai4x/context/**",
  ".ai4x/coordination/**",
  ".ai4x/generated/agent-context/capabilities/**",
  ".ai4x/generated/agent-context/participants/*/context.md",
  ".ai4x/governance/**",
  ".ai4x/intent/**",
  ".ai4x/operations/**",
  ".ai4x/planning/**",
  ".ai4x/records/**",
  ".ai4x/team/**",
  ".github/ISSUE_TEMPLATE/**",
  ".github/agents/**",
  ".github/copilot-instructions.md",
  "AGENTS.md",
  "CHANGELOG",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "INSTALL",
  "LICENSING.md",
  "README.md",
  "SECURITY.md",
  "acc/img/ai4X Logo.jpg",
  "adm/gdl/*.md",
  "adm/gdl/index.yaml",
  "adm/pbl/**",
  "crp/**",
  "doc/**",
  "src/bundles/**",
  "src/corpus/README.md",
