  ".ai4x/generated/agent-context/participants/*/manifest.json",
  ".codex/**",
  ".gitattributes",
  ".github/workflows/**",
  ".gitignore",
  "Makefile",
  "REUSE.toml",
  "adm/gdl/dev/schemas/**",
  "cli/**",
  "src/.gitkeep",
  "src/assurance/**",
  "src/cabal.project",
  "src/cli/**",
  "src/corpus/*.cabal",
  "src/corpus/releases/**",
  "src/corpus/schema/**",
  "src/corpus/src/**",
  "src/corpus/test/**",
  "src/light/**",
  "src/packages/**",
  "src/policy/**",
  "src/skeletons/**",
  "util/**",
  "utl/**",
]
